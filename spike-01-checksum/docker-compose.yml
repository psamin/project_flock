services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flock
      POSTGRES_PASSWORD: flock
      POSTGRES_DB: flock
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flock -d flock"]
      interval: 2s
      timeout: 3s
      retries: 30

  cockroach:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health?ready=1"]
      interval: 2s
      timeout: 3s
      retries: 30

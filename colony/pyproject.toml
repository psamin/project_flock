[project]
name = "colony"
version = "0.1.0"
description = "Colony — fleet coordination layer on CockroachDB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = ["pytest>=8.0", "boto3>=1.35", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: requires a live CockroachDB (skipped when unreachable)",
]
